# ==============================================================================
# Apache ZooKeeper 3.8.0 Ensemble Configuration (3-Node Quorum)
# ==============================================================================

# Basic time unit in milliseconds used by ZooKeeper for heartbeats
tickTime=2000

# Time (in ticks) to allow followers to connect and sync to the leader
initLimit=10

# Time (in ticks) to allow followers to sync with ZooKeeper
syncLimit=5

# Directory where ZooKeeper stores in-memory snapshots and the transaction log
dataDir=/var/lib/zookeeper

# Port at which clients (HiveServer2, Beeline) connect
clientPort=2181

# Maximum number of concurrent client connections per IP address
maxClientCnxns=60

# Session timeouts (milliseconds)
minSessionTimeout=4000
maxSessionTimeout=40000

# Whitelist 4-letter words (4LW) commands for health checks and status queries
4lw.commands.whitelist=stat,ruok,conf,isro,srvr,mntr

# Automatic purge of snapshots and transaction logs (retention: 3 snapshots)
autopurge.snapRetainCount=3
autopurge.purgeInterval=24

# ------------------------------------------------------------------------------
# 3-Node Quorum Ensemble Peer Mapping
# Format: server.<myid>=<hostname>:<peer_communication_port>:<leader_election_port>
# - Port 2888: Follower-to-Leader data synchronization
# - Port 3888: Fast Leader Election (FLE) consensus protocol
# ------------------------------------------------------------------------------
server.1=master:2888:3888
server.2=worker1:2888:3888
server.3=worker2:2888:3888
